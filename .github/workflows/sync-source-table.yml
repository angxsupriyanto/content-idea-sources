name: Sync content tables

on:
  push:
    branches: [main]
    paths:
      - sources.json
      - product_catalog.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-content-tables
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render table from JSON
        run: python3 scripts/sync_readme.py
      - name: Commit table if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README table is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Sync README content tables"
          git push
